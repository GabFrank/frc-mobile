<ion-header>
  <ion-toolbar>
    <ion-title>Datos de la devolución</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onCancel()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="producto-nombre">{{ producto?.descripcion }}</div>

  <ion-list>
    <ion-item>
      <ion-label position="stacked">Presentación</ion-label>
      <ion-select
        [(ngModel)]="selectedPresentacionId"
        interface="action-sheet"
        placeholder="Seleccionar presentación">
        <ion-select-option *ngFor="let p of presentaciones" [value]="p.id">
          {{ p.descripcion }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Cantidad</ion-label>
      <ion-input type="number" min="1" [(ngModel)]="cantidad" placeholder="0"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Motivo de avería</ion-label>
      <ion-select
        [(ngModel)]="selectedMotivoAveriaId"
        interface="action-sheet"
        placeholder="Seleccionar motivo">
        <ion-select-option *ngFor="let m of motivosAveria" [value]="m.id">
          {{ m.descripcion }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Vencimiento</ion-label>
      <ion-input type="date" [(ngModel)]="vencimiento" placeholder="Seleccionar fecha"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Lote</ion-label>
      <ion-input [(ngModel)]="lote" autocapitalize="characters" placeholder="Opcional"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Observación</ion-label>
      <ion-textarea [(ngModel)]="motivo" rows="2" placeholder="Opcional"></ion-textarea>
    </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="onGuardar()">
    Agregar item
  </ion-button>
</ion-content>
