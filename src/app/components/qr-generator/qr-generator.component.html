<ion-content>
  <div class="qr-container">
    <ngx-qrcode [value]="value" [scale]="6"> </ngx-qrcode>
    <br />
    <div>Utilice la camara del smartphone</div>
    <div>para capturar imagenes</div>
  </div>

  <div style="text-align: center; display: flex; justify-content: center;">
    <ion-button (click)="onSalir()" fill="clear">
      Salir
    </ion-button>
    <ion-button (click)="onCompartir()" fill="clear" [disabled]="compartiendo">
      Compartir
    </ion-button>
  </div>
</ion-content>
